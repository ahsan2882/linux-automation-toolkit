# Create a `verify.conf` file in the `config` directory with the following content:
# Directory containing archives created by backup.sh
BACKUP_DIR="/path/to/backup/drive"

# Only archives matching this prefix are considered
BACKUP_PREFIX="backup"

# Temporary workspace for test extraction
# Use a filesystem with enough free space for the uncompressed data.
TEMP_DIR="/tmp"

# Verification log
VERIFY_LOG="/var/log/linux-backup-verify.log"

# false: remove temporary files after verification
# true: preserve the workspace after a failed verification
KEEP_TEMP_ON_FAILURE=false
SAMPLE_SIZE=100
SOURCE_DIRS=("/path/to/source1" "/path/to/source2")   # same list as backup.conf