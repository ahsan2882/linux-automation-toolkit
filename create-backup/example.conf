# Create a `backup.conf` file in the `config` directory with the following content:
# Directories to back up
SOURCE_DIRS=(
    "/home/user/Desktop/Media"
    "/home/user/Desktop/Projects"
)

# Backup destination on a separate physical disk
BACKUP_DIR="/path/to/backup/drive"

# Number of successful backups to retain
RETENTION_COUNT=7

# Log file
LOG_FILE="/var/log/linux-backup.log"

# Archive filename prefix
BACKUP_PREFIX="backup"

# Compression level: 1 (fastest) to 9 (smallest)
COMPRESSION_LEVEL=7

# Directory/file patterns to exclude.
# Patterns use GNU tar wildcard matching.
EXCLUDE_DIR_PATTERNS=(
    "node_modules"
    ".git"
    ".svn"
    "venv"
    ".venv"
    "__pycache__"
    ".cache"
    "cache"
    "dist"
    "build"
    ".angular"
    ".next"
    "coverage"
)

# File patterns to exclude
EXCLUDE_FILE_PATTERNS=(
    "*.log"
    "*.tmp"
    "*.temp"
    "*.cache"
    "*.pyc"
    "*.pyo"
    "*.swp"
    "*.bak"
    "*~"
)
